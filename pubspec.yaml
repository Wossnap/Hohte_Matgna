name: mobile
description: "A new Flutter project for the HohteMobile application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  flutter_svg: ^2.1.0
  http: ^1.1.0
  shared_preferences: ^2.2.2
  http_parser: ^4.0.0
  
  # Audio & Recording packages
  audioplayers: ^6.1.1
  record: ^6.1.2
  permission_handler: ^11.0.0
  path_provider: ^2.1.0
  url_launcher: ^6.2.5
  # Keeps the screen awake during interactive playback (e.g. Alternating
  # Playback) so it doesn't dim/lock and stall mid-session.
  wakelock_plus: ^1.2.8
  # Detects whether the karaoke is actually on-screen so the wakelock is only
  # held while the user is viewing it during main-audio playback.
  visibility_detector: ^0.4.0+2
  just_audio: ^0.10.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.10.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/Hohte_logo.svg
    - assets/images/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#021859"
  adaptive_icon_foreground: "assets/images/app_icon.png"